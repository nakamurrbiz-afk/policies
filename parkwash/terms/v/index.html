<style>
:root{--ground:#F2EFE6;--ink:#16150F;--accent:#C9331F;--sub:#5E574B;--rule:#D9D2C3;--table:#F7F3EA}
@media (prefers-color-scheme: dark){:root{--ground:#16150F;--ink:#EDE8DC;--accent:#E0624C;--sub:#B3AB9B;--rule:#3A372E;--table:#1F1D16}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
line-height:1.85;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.draft{background:var(--accent);color:#F2EFE6;padding:10px 16px;font-size:14px;text-align:center}
.foot{max-width:760px;margin:0 auto;padding:32px 16px 48px;border-top:1px solid var(--rule);font-size:14px;color:var(--sub)}
.foot nav{display:flex;flex-wrap:wrap;gap:4px 20px}
.foot a{color:var(--sub);display:inline-block;min-height:44px;line-height:44px}

.top{max-width:760px;margin:0 auto;padding:16px;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.top svg{width:40px;height:40px}
.top span{font-weight:700;font-size:18px}
main{max-width:760px;margin:0 auto;padding:8px 16px 40px;overflow-wrap:anywhere}
h1{font-size:28px;line-height:1.4;margin:24px 0 8px}
h2{font-size:20px;line-height:1.5;margin:40px 0 8px;padding-top:16px;border-top:1px solid var(--rule)}
h3{font-size:17px;margin:28px 0 8px}
p,li{font-size:16px}
ol,ul{padding-left:1.5em}
/* 条ごとの見出しに罫を引いているので、区切りの hr は重ねない */
hr{display:none}
blockquote{margin:16px 0;padding:8px 16px;border-left:3px solid var(--rule);color:var(--sub)}
.table{overflow-x:auto;margin:16px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--table)}
.ver{font-size:14px;color:var(--sub);margin:0 0 24px}
.ver a{display:inline-block;min-height:44px;line-height:44px}
.hole{background:#FBE3DD;color:#8A1F10;padding:0 4px;border-radius:2px}
@media (prefers-color-scheme: dark){.hole{background:#4A1D14;color:#FFD6CC}}
</style>
