      <h1>停めているあいだに、<br>拭き上げます。</h1>
      <p class="lead">駐車場に停めたまま、15〜20分。<br>買い物から戻ったときには終わっています。</p>
      <p class="note">落とせるのはホコリ・花粉・水滴跡まで。<br>泥・油膜・鳥フン・固着汚れは対象外です。</p>
      <p class="soon">App Store にて近日公開</p>
