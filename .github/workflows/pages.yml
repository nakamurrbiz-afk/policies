# Publishes this repository to GitHub Pages.
#
# `configure-pages` is given `enablement: true` so the first run turns Pages on
# itself. Pages cannot be enabled from where this repository is maintained —
# the API path is blocked upstream — and a privacy policy that App Review
# cannot open is the one thing that stops a submission cold.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Only the published pages, so the artifact carries no repository
      # metadata and stays small.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r pacelock _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
